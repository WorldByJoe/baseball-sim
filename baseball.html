<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Ballgame</title>
<!-- ============================================================================
  baseball.html · v2.6 · 2026-10-02

  The baseball app's screen: a whole game, played by the engine up front
  (about 50 ms) and then REPLAYED on a fixed schedule - game night mode
  (Joe, 2026-09-29): a pitch every ten seconds or so, every number on
  screen real, nothing hidden. The schedule is deterministic, so ?t=SECONDS
  seeks to any moment of a game (used to check frames headless), ?seed=N
  draws another game, ?speed=X paces it.

  Each pitch is three beats. SETUP (3 s): the count, the pitcher's intent
  and pitch mix, where he is aiming (crosshair, one-sigma command circle),
  and the pitch the batter is sitting on (his dashed picture of it).
  FLIGHT (1.8 s): the real pitch flies in slow motion in the catcher's view
  and across the field; the two paths separate at the commit point; his
  barrel appears if he swings. RESULT: the read (picked up / fooled), his
  judgement, the swing or the call, and for a ball in play the play itself
  at real speed on the field - the ball's shadow and height, the fielder
  who takes it, throws, runners, outs and runs - then the banner.

  Around the action: line score and win-probability ribbon (an estimate
  from run difference, innings left and the base-out state), count, outs,
  bases, park air and umpire; the batter's and pitcher's trait cards with
  250-PA projections; this at-bat's pitches. A pre-game screen shows both
  lineups and starters first. Keys: space pauses, arrows skip a plate
  appearance, up and down arrows change speed, g draws a new game.

  Layout in design px of a 3840 x 2160 screen scaled to the window. Data
  rows are the wall's 30 px floor (below its 37 px sofa floor, the price of
  showing everything). Pitch-type colours: the eight validated dark hues,
  assigned so every real repertoire is as distinct as they allow;
  colour-blind separation waived for now (Joe).

  CHANGED
    v2.6  engine v1.2 (the swing policy fitted to the league's swing curves)
    v2.5  engine v1.1 (the adjusted swing)
    v2.4  engine v1.0 (perception and pitch variety): the drawn pitch and the
          pitcher's card carry his seam break; the drawn ghost is his picture of it
    v2.3  a bases-loaded walk or hit batsman: the man forced in from third jogs home and
          then to the bench (he had stayed on third); the banner says the run scored (Joe)
    v2.2  engine v0.9 (the swing as a tilted circle); the catcher's-view bat swings to
          its attack angle where it met the ball
============================================================================ -->

        if (seg.kind === 'result') {
          var stl = p.steal, wld = p.wild, rn = stl && byId2(play, stl.id);
          if (stl && !stl.back && tau > Math.max(0.5, stl.tRun - 1.35) + 0.2) { laneMain = stl.safe ? 'Stolen base' : (play.pa.result === 'END' ? 'Caught stealing, inning over' : 'Caught stealing'); laneSub = (rn ? rn.name : '') + (stl.wild ? ' · the throw gets away' : ''); }
          if (wld && tau > 1.2) { laneMain = wld.kind === 'WP' ? 'Wild pitch' : 'Passed ball'; laneSub = wld.runs ? 'runner scores' : 'runner' + (wld.from.length > 1 ? 's' : '') + ' move' + (wld.from.length > 1 ? '' : 's') + ' up'; }
        }
      } else count = play.pa.pitches[0].count;
      // bases and outs follow each pitch (a steal or a wild pitch moves them mid-count)
      var mid = i >= 0 && seg.kind === 'result' && tau >= 2.6 && play.pa.pitches[i].basesAfter;
      outs = done ? play.outsAfter : mid ? play.pa.pitches[i].outsAfter : play.outs;
      bases = done ? play.basesAfter : mid ? play.pa.pitches[i].basesAfter : (i >= 0 && play.pa.pitches[i].bases) || play.bases;
      if (seg.kind === 'change') { laneMain = seg.change ? 'Pitching change' : 'Pinch hitter'; laneSub = seg.change ? seg.change.in.name + ' for ' + seg.change.out.name : seg.pinch.batter.name + ' for ' + seg.pinch.forPitcher.name; }
    } else if (seg.kind === 'halfEnd') {
      var inn = seg.inn, lastPlay = inn.plays[inn.plays.length - 1];
      play = lastPlay; done = true; outs = 3; bases = [];
      laneMain = (inn.half ? 'End of the ' : 'Middle of the ') + ORD[inn.n]; laneSub = G.teams[0].nick + ' ' + lastPlay.score[0] + ', ' + G.teams[1].nick + ' ' + lastPlay.score[1];
    } else if (seg.kind === 'halfStart') {
      var first = seg.inn.plays[0];
      play = first; count = ''; outs = 0; bases = first.bases; done = false;
      laneMain = (seg.inn.half ? 'Bottom of the ' : 'Top of the ') + ORD[seg.inn.n]; laneSub = G.teams[seg.inn.half].nick + ' batting';
    }
    var quiet = seg.kind === 'halfStart' || seg.kind === 'halfEnd';
    // one drawing fault must never blank the screen for the rest of the game (logged once)
    function safe(name, fn) { try { fn(); } catch (err) { if (!FAULTS[name]) { FAULTS[name] = true; console.error(name, err); } } }
    safe('field', function () { drawField(seg.kind === 'final' ? { kind: 'final', play: G.plays[G.plays.length - 1] } : seg.kind === 'pregame' ? { kind: 'pregame', play: G.plays[0] } : quiet ? { kind: seg.kind, play: play, inn: seg.inn } : seg, tau, t); });
    safe('zone', function () { drawZone(quiet ? { kind: seg.kind, play: null } : seg, tau); });
    safe('board', function () { drawBoard(seg, play, done); });
    safe('state', function () { drawState(seg, play, count, outs, bases); });
    // the last at-bat's reasoning lingers while its man walks off and the next walks up (Joe)
    var linger = null;
    if (play && (seg.kind === 'paStart' || seg.kind === 'change')) { var kp = G.plays.indexOf(play), pv = kp > 0 ? G.plays[kp - 1] : null; if (pv && pv.half === play.half && pv.inning === play.inning) linger = pv; }
    if (seg.kind === 'halfEnd') linger = play;
    var thinkSeg = linger ? { kind: 'result', play: linger, i: linger.pa.pitches.length - 1 } : quiet ? { kind: seg.kind, play: null } : seg;
    safe('panels', function () {
      drawThink(thinkSeg, linger ? 99 : tau);
      if (quiet) { drawSeq(null); drawBatter(seg.kind === 'halfStart' ? play : null); drawPitcher(seg.kind === 'halfStart' ? play : null, 0); }
      else { drawSeq(play, seg.i === undefined ? -1 : seg.i, seg.kind === 'result'); drawBatter(play); drawPitcher(play, thrown); }
    });
    lane(laneMain, laneSub);
    var spd = speed >= 1 ? speed.toFixed(2).replace(/\.?0+$/, '') : '1/' + Math.round(1 / speed);
    EL.hud.innerHTML = '<span class="fig hot">' + (paused ? '❚❚' : '▶') + ' ' + spd + '×</span>&nbsp;&nbsp;&nbsp;seed ' + SEED + ' · space pause · ↑ ↓ speed · ← → at-bat · g new game';
  }

  function init() {
    var f = setup('field', FW, FH, 0, 0); fieldC = f.c; fieldG = f.g; bg = null;
    var z = setup('zone', ZW, ZH, ZX, ZY); zoneC = z.c; zoneG = z.g;
  }
  init();
  window.addEventListener('resize', init);
  function frame(now) {
    if (lastNow === null) lastNow = now;
    if (!paused) T += (now - lastNow) / 1000 * speed;
    lastNow = now;
    if (T > total) T = total - 0.01;
    render(T);
    requestAnimationFrame(frame);
  }
  render(T);
  requestAnimationFrame(frame);
  window.BALLGAME = { G: G, SEG: SEG, seek: function (t) { T = t; }, total: total, PEOPLE: PEOPLE, stateAt: stateAt, THROWS: THROWS };
  // The wall's stall watchdog asks how long this URL may be held: one whole game at
  // this speed (per run) plus a few seconds to build and lay it out (once).
  function declareBudget() { window.WALL_SECONDS_PER_RUN = Math.round(total / (speed || SPEED)); window.WALL_SECONDS_ONCE = 5; }
  declareBudget();
})();
</script>
