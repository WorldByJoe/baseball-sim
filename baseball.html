<title>Ballgame</title>
<!-- ============================================================================
  baseball.html · v4.3 · 2026-10-03

  The baseball app's screen: a whole game, played by the engine up front
  (about 50 ms) and then REPLAYED on a fixed schedule - game night mode
  (Joe, 2026-09-29): a pitch every ten seconds or so, every number on
  screen real, nothing hidden. The schedule is deterministic, so ?t=SECONDS
  seeks to any moment of a game (used to check frames headless), ?seed=N
  draws another game, ?speed=X paces it.

  Each pitch is three beats. SETUP (3 s): the count, the pitcher's intent
  and pitch mix, where he is aiming (crosshair, one-sigma command circle),
  and the pitch the batter is sitting on (his dashed picture of it).
  FLIGHT (1.8 s): the real pitch flies in slow motion in the catcher's view
  and across the field; the two paths separate at the commit point; his
  barrel appears if he swings. RESULT: the read (picked up / fooled), his
  judgement, the swing or the call, and for a ball in play the play itself
  at real speed on the field - the ball's shadow and height, the fielder
  who takes it, throws, runners, outs and runs - then the banner.

  Around the action: line score and win-probability ribbon (an estimate
  from run difference, innings left and the base-out state), count, outs,
  bases, park air and umpire; the batter's and pitcher's trait cards with
  250-PA projections; this at-bat's pitches. A pre-game screen shows both
  lineups and starters first. Keys: space pauses, arrows skip a plate
  appearance, up and down arrows change speed, g draws a new game, v mutes
  the announcers, c the crowd, the field sounds and the organ.

  The broadcast: at load the whole game's call is written ahead (bb_call.js)
  and played on the clock (bb_sound.js): the announcers from the speech
  server on the Pi (tts/speech_server.py), the crowd and the field from
  sounds/ (sounds/manifest.js lists them), the organ synthesised. Without
  the server or the files the page plays exactly as before, silently.

  Layout in design px of a 3840 x 2160 screen scaled to the window. Data
  rows are the wall's 30 px floor (below its 37 px sofa floor, the price of
  showing everything). Pitch-type colours: the eight validated dark hues,
  assigned so every real repertoire is as distinct as they allow;
  colour-blind separation waived for now (Joe).

  CHANGED
    v4.3  games from the league's stable (stable/bb_stable.js) when it is beside the page: the level
          named in the line-ups and the state panel; without it, two new teams as before
    v4.2  engine v2.6 (athleticism)
    v4.1  the manager's moves (bb_game v0.9): intentional walks, throws over to first (the
          runner diving back, or picked off), late defensive changes and double switches,
          with the men walking on and off; at-bats with no pitch are drawn
    v4.0  the players move as if tracked by GPS (Joe): fielders wander, get set and step in
          with each pitch; the pitcher strides, the catcher sets up on the target; the batter
          strides and steps out; runners lead off and get back; outfielders chase home runs
          and fouls bound for the seats; the catcher's-view bat swings on the engine's circle
          in his tilted plane, with the sweet spot's path drawn
    v3.9  the broadcast (PR #5, page v2.7) on engine v2.4: two announcers, the public-address
          announcer, the crowd, the field and the organ, written ahead and played on the
          game's clock; v and c mute the voices and the park; silent without them; the
          schedule from bb_schedule.js; a seventh-inning stretch; uniform numbers on the cards
============================================================================ -->

<script>
(function () {
  'use strict';
  var U = BB.units, FT = U.FT, IN = U.IN, MPH = U.MPH, DEG = U.DEG, GEO = BB.geometry;
  var COL = { FF: '#199e70', SI: '#3987e5', FC: '#9085e9', SL: '#c98500', ST: '#d95926', CU: '#d55181', CH: '#008300', FS: '#e66767' };
  var INK = 'rgba(238,244,252,.95)', INK2 = 'rgba(206,220,240,.78)', INK3 = 'rgba(206,220,240,.48)';
  // team colours: two of six, chosen from the nickname so the game's own random stream is untouched
  var TEAM_COLS = ['#e8c547', '#6ec1ff', '#ff8a65', '#c7a3ff', '#7fe0b2', '#ff7fb0'];
  function hashStr(t) { var h = 7; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; }
  var MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
  var Q = new URLSearchParams(location.search);
  var SEED = Q.has('seed') ? +Q.get('seed') : 100 + Math.floor(Date.now() / 60000) % 90000;   // no seed asked for: a new game from the clock (the HUD shows it, so it can be replayed)
  var SPEED = +Q.get('speed') || 1, SEEK = +Q.get('t') || 0;
  var PACE = BBSchedule.PACE;
  // how people move, in seconds: a jog back to the dugout, the walk out to a position, seat to the
  // on-deck circle, circle to the plate, a jog to the next bag on a walk (the home-run trot per base
  // and the grand-slam huddle are the schedule's)
  var WALK = 5.0, WALK_OUT = 6.0, DECK_WALK = 3.0, PLATE_WALK = 3.0, JOG_BASE = 2.6, CELEB = BBSchedule.CELEB;
  var BASES = BBField.BASES;
  var BACKSTOP_Y = -6.5;   // m behind the plate where a wild pitch is run down: closer than a real backstop, so it stays on the drawing

  var Phi = BBSchedule.Phi;
  function f0(v) { return Math.round(v).toLocaleString(); }
  function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function pct(a, b) { return b ? f1(100 * a / b) : '-'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function place(id, x, y, w, h) {
    var el = document.getElementById(id);
    el.style.left = 'calc(' + x + ' * var(--wu))'; el.style.top = 'calc(' + y + ' * var(--wu))';
    el.style.width = 'calc(' + w + ' * var(--wu))'; if (h) el.style.height = 'calc(' + h + ' * var(--wu))';
    return el;
  }
  function setHTML(el, html) { if (el._h !== html) { el._h = html; el.innerHTML = html; } }
  var ORD = ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th', '11th', '12th', '13th', '14th', '15th', '16th', '17th', '18th'];

  // ============================================================ THE GAME
  // drawn by bb_schedule.js, so the headless tools play the very same game for a seed
  var GAME = BBSchedule.game(SEED), G = GAME.G, away = GAME.away, home = GAME.home, env = GAME.env, parkName = GAME.parkName, ump = GAME.ump, PLAYER = GAME.PLAYER;
  away.col = TEAM_COLS[hashStr(away.nick) % 6];
  home.col = TEAM_COLS[(hashStr(home.nick) + (TEAM_COLS[hashStr(home.nick) % 6] === away.col ? 1 : 0)) % 6];
  var rho0 = BB.makeEnv({ tempF: 70, elevFt: 0, rh: 0.5 }).rho;
  // 250-PA projections for the cards and the pre-game sheet; a separate stream
  var r2 = BB.makeRng((SEED ^ 0x5bd1e995) >>> 0), lp = [], lb = [], k;
  for (k = 0; k < 24; k++) lp.push(BB.makePitcher(r2, { role: k < 14 ? 'SP' : 'RP' }));
  for (k = 0; k < 48; k++) lb.push(BB.makeBatter(r2, {}));
  var U2 = BB.makeUmp(r2), PROJ = {};
  function newStats() { return { pa: 0, K: 0, BB: 0, HR: 0, sw: 0, wh: 0, oz: 0, ch: 0, np: 0, iz: 0, ev: 0, nev: 0 }; }
  function addPA(s, r) {
    s.pa++; if (r.result === 'K') s.K++; if (r.result === 'BB') s.BB++; if (r.result === 'HR') s.HR++;
    r.pitches.forEach(function (p) {
      s.np++; if (p.inZone) s.iz++; else s.oz++;
      if (p.swing) { s.sw++; if (!p.swing.contact) s.wh++; if (!p.inZone) s.ch++; }
      if (p.bb && p.bb.fair) { s.ev += p.bb.ev; s.nev++; }
    });
  }
  function projBatter(B) {
    if (PROJ['b' + B.id]) return PROJ['b' + B.id];
    var s = newStats();
    for (var i = 0; i < 250; i++) { var P = lp[i % lp.length]; P.load = r2.u() * P.stamina; addPA(s, BB.simPA(P, B, { env: BB.mlbEnv(r2), ump: U2, framing: 0, seen: r2.u() * 80 }, r2)); }
    return (PROJ['b' + B.id] = s);
  }
  function projPitcher(P) {
    if (PROJ['p' + P.id]) return PROJ['p' + P.id];
    var s = newStats(), save = P.load;
    for (var i = 0; i < 250; i++) { P.load = r2.u() * P.stamina; addPA(s, BB.simPA(P, lb[i % lb.length], { env: BB.mlbEnv(r2), ump: U2, framing: 0, seen: r2.u() * 80 }, r2)); }
    P.load = save;
    return (PROJ['p' + P.id] = s);
  }
  // movement of a pitcher's pitches (vs spinless), for his card
  function movement(P) {
    if (P._moved) return;
    var rel = BB.releasePoint(P);
    P.pitches.forEach(function (q) {
      var spd = q.velo * MPH, a = BB.aim(rel, spd, q.rpm, q.tilt, q.eff, P.armSide, [0, 0.76], env, null, q.seam);
      var d = BB.dirOf(a.yaw, a.pit), v0 = [d[0] * spd, d[1] * spd, d[2] * spd];
      var r = BB.flyPitch(rel, v0, BB.spinVector(d, q.rpm, q.tilt, q.eff, P.armSide), env, false, q.seam, P.armSide), o = BB.flyPitch(rel, v0, [0, 0, 0], env, false);
      q.ivb = (r.z - o.z) / IN; q.hb = (r.x - o.x) / IN * P.armSide;
    });
    P._moved = true;
  }

  // ========================================================= THE SCHEDULE
  // laid out by bb_schedule.js (the broadcast script is written against the same clock)
  var SCHED = BBSchedule.build(G, PLAYER), SEG = SCHED.SEG, total = SCHED.total, segAt = SCHED.segAt, playDuration = SCHED.playDuration, runnerArrive = SCHED.runnerArrive;
  // the broadcast, written ahead for the whole game, and its player; neither may ever stop the picture
  var CALL = null, SOUND = null;
  try { CALL = BBCall.write(GAME, SCHED); SOUND = BBSound.create({ call: CALL, SEG: SEG, segAt: segAt, seed: SEED, base: 'sounds/' }); }
  catch (err) { console.error('broadcast', err); SOUND = null; }

  // ============================================================ THE CLOCK
  var T = SEEK, speed = SPEED, paused = false, lastNow = null;
  document.addEventListener('keydown', function (e) {
    var s = segAt(T), i = SEG.indexOf(s);
    if (e.key === ' ') { paused = !paused; e.preventDefault(); }
    else if (e.key === 'ArrowRight') { for (var j = i + 1; j < SEG.length; j++) if (SEG[j].kind === 'paStart' || SEG[j].kind === 'halfStart' || SEG[j].kind === 'final') { T = SEG[j].t0; break; } }
    else if (e.key === 'ArrowLeft') { for (var q = i - 1; q >= 0; q--) if (SEG[q].kind === 'paStart' || SEG[q].kind === 'halfStart') { T = SEG[q].t0; break; } }
    else if (e.key === 'ArrowUp') { speed = Math.min(16, speed * 2); declareBudget(); e.preventDefault(); }       // powers of two, 1/4x to 16x (Joe)
    else if (e.key === 'ArrowDown') { speed = Math.max(0.25, speed / 2); declareBudget(); e.preventDefault(); }
    else if (e.key === 'v' && SOUND) SOUND.toggle('voice');
    else if (e.key === 'c' && SOUND) SOUND.toggle('crowd');
    else if (e.key === 'g') location.replace(location.pathname + '?seed=' + (SEED + 1) + (speed !== 1 ? '&speed=' + speed : ''));
    else if (e.key === 'p' && s.kind === 'pregame') T = s.t0 + s.dur;
  });

  // ============================================================== FIELD
  var FW = 2330, FH = 1690, S = 3.3, HX = 1165, HY = 1600;
  function fx(m) { return HX + m / FT * S; }        // metres -> canvas x
  function fy(m) { return HY - m / FT * S; }
  function polarFt(r, a) { return [r * Math.sin(a * DEG), r * Math.cos(a * DEG)]; }
  var fieldC, fieldG, bg = null, zoneC, zoneG;
  function setup(id, W, H, x, y) {
    var c = place(id, x, y, W, H), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    var g = c.getContext('2d'); g.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    return { c: c, g: g };
  }
  function text(g, s, x, y, px, col, align, base) {
    g.font = px + 'px ' + MONO; g.fillStyle = col; g.textAlign = align || 'left'; g.textBaseline = base || 'alphabetic';
    g.fillText(s, x, y);
  }
  function drawFieldBG(g) {
    var a, p, fenceFt = function (sp) { return BB.fenceAt(env, sp) / FT; };
    var pf = function (rFt, aDeg) { var q = polarFt(rFt, aDeg); return [HX + q[0] * S, HY - q[1] * S]; };
    g.fillStyle = '#0b0e14'; g.fillRect(0, 0, FW, FH);
    g.beginPath();
    var cL = pf(fenceFt(-45), -45), cR = pf(fenceFt(45), 45);
    g.moveTo(cL[0] - 32, cL[1] + 32);
    for (a = 225; a <= 315; a += 5) { p = pf(60, a + 90); g.lineTo(p[0], p[1]); }
    g.lineTo(cR[0] + 32, cR[1] + 32);
    for (a = 45; a >= -45; a -= 1) { p = pf(fenceFt(a), a); g.lineTo(p[0], p[1]); }
    g.closePath(); g.fillStyle = '#152018'; g.fill();
    function wedge(inset) { g.beginPath(); g.moveTo(HX, HY); for (a = -45; a <= 45; a += 1) { p = pf(fenceFt(a) - inset, a); g.lineTo(p[0], p[1]); } g.closePath(); }
    wedge(0); g.fillStyle = '#2d251c'; g.fill();
    wedge(15); g.fillStyle = '#1b281d'; g.fill();
    g.save(); wedge(0); g.clip(); g.beginPath(); g.arc(HX, HY - 60.5 * S, 95 * S, 0, 7); g.fillStyle = '#3a2f23'; g.fill(); g.restore();
    var b1 = pf(90, 45), b2 = pf(127.28, 0), b3 = pf(90, -45);
    g.beginPath(); g.moveTo(HX, HY - 7 * S); g.lineTo(b1[0] - 6 * S, b1[1]); g.lineTo(HX, b2[1] + 7 * S); g.lineTo(b3[0] + 6 * S, b3[1]); g.closePath();
    g.fillStyle = '#1b281d'; g.fill();
    [[0, 59, 9], [0, 0, 13]].forEach(function (c) { g.beginPath(); g.arc(HX + c[0] * S, HY - c[1] * S, c[2] * S, 0, 7); g.fillStyle = '#3a2f23'; g.fill(); });
    g.strokeStyle = 'rgba(238,244,252,.5)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(cL[0], cL[1]); g.lineTo(HX, HY); g.lineTo(cR[0], cR[1]); g.stroke();
    g.beginPath(); for (a = -45; a <= 45; a += 1) { p = pf(fenceFt(a), a); if (a === -45) g.moveTo(p[0], p[1]); else g.lineTo(p[0], p[1]); }
    g.strokeStyle = 'rgba(238,244,252,.7)'; g.lineWidth = 5; g.stroke();
    [-45, -22.5, 0, 22.5, 45].forEach(function (s) { var q = pf(fenceFt(s) - 24, s); text(g, f0(fenceFt(s)), q[0], q[1], 30, 'rgba(238,244,252,.6)', 'center', 'middle'); });
    g.fillStyle = INK;
    [b1, b2, b3].forEach(function (b) { g.save(); g.translate(b[0], b[1]); g.rotate(Math.PI / 4); g.fillRect(-7, -7, 14, 14); g.restore(); });
    g.beginPath(); g.moveTo(HX - 0.71 * S, HY - 1.42 * S); g.lineTo(HX + 0.71 * S, HY - 1.42 * S); g.lineTo(HX + 0.71 * S, HY - 0.71 * S); g.lineTo(HX, HY);
    g.lineTo(HX - 0.71 * S, HY - 0.71 * S); g.closePath(); g.fill();
    g.fillRect(HX - 1 * S, HY - 61 * S, 2 * S, 0.5 * S);
  }
  function person(g, x, y, label, effort) {   // effort 0..1 lights the dot: his speed over his own top speed (white, so no team colour is mistaken for it)
    g.beginPath(); g.arc(x, y, 20, 0, 7); g.fillStyle = '#0b0e14'; g.fill();

      else { drawSeq(play, pkSeg ? seg.i - 1 : seg.i === undefined ? -1 : seg.i, seg.kind === 'result' || pkSeg); drawBatter(play); drawPitcher(play, thrown); }
    });
    lane(laneMain, laneSub);
    var spd = speed >= 1 ? speed.toFixed(2).replace(/\.?0+$/, '') : '1/' + Math.round(1 / speed);
    EL.hud.innerHTML = '<span class="fig hot">' + (paused ? '❚❚' : '▶') + ' ' + spd + '×</span>&nbsp;&nbsp;&nbsp;seed ' + SEED + ' · space pause · ↑ ↓ speed · ← → at-bat · g new game' + soundWords();
  }

  function soundWords() {   // the two sound keys, and what is off
    if (!SOUND) return '';
    var st = SOUND.state();
    return ' · v voices' + (st.voice ? (st.server ? '' : ' (no server)') : ' off') + ' · c crowd' + (st.crowd ? (st.files ? '' : ' (no files)') : ' off');
  }
  function init() {
    var f = setup('field', FW, FH, 0, 0); fieldC = f.c; fieldG = f.g; bg = null;
    var z = setup('zone', ZW, ZH, ZX, ZY); zoneC = z.c; zoneG = z.g;
  }
  init();
  window.addEventListener('resize', init);
  function frame(now) {
    if (lastNow === null) lastNow = now;
    if (!paused) T += (now - lastNow) / 1000 * speed;
    lastNow = now;
    if (T > total) T = total - 0.01;
    render(T);
    if (SOUND) try { SOUND.update(T, speed, paused); } catch (err) { if (!FAULTS.sound) { FAULTS.sound = true; console.error('sound', err); } }
    requestAnimationFrame(frame);
  }
  render(T);
  requestAnimationFrame(frame);
  window.BALLGAME = { G: G, SEG: SEG, seek: function (t) { T = t; }, total: total, PEOPLE: PEOPLE, stateAt: stateAt, THROWS: THROWS, CALL: CALL, SOUND: SOUND };
  // The wall's stall watchdog asks how long this URL may be held: one whole game at
  // this speed (per run) plus a few seconds to build and lay it out (once).
  function declareBudget() { window.WALL_SECONDS_PER_RUN = Math.round(total / (speed || SPEED)); window.WALL_SECONDS_ONCE = 5; }
  declareBudget();
})();
</script>
